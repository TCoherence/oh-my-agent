name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests scripts

      - name: Run mypy
        run: mypy src

      - name: Run pytest
        run: pytest -q

  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build first: the TanStack Router plugin generates routeTree.gen.ts here,
      # which the typecheck needs. The packaging path (setup.py hook + wheel
      # contents) is exercised separately by the `package` job below.
      - name: Build SPA
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run vitest
        run: npm run test:run

  package:
    name: wheel (SPA included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          pip install build

      # OMA_REQUIRE_FRONTEND=1: this job exercises the real packaging
      # path — setup.py's BuildPyWithFrontend must run npm ci + npm run
      # build and fail loudly if the SPA can't be built. (A plain
      # `pip install -e .` without the var stays best-effort so dev
      # installs don't need Node.)
      - name: Build wheel
        run: python -m build --wheel
        env:
          OMA_REQUIRE_FRONTEND: "1"

      - name: Assert SPA shipped inside the wheel
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, got: {wheels}")
          target = "oh_my_agent/dashboard/web_dist/index.html"
          with zipfile.ZipFile(wheels[0]) as wheel:
              if target not in wheel.namelist():
                  sys.exit(f"{target} missing from {wheels[0]} — wheel shipped without the SPA")
          print(f"OK: {target} present in {wheels[0]}")
          PY
