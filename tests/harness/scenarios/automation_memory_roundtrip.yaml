scenario: automation-memory-roundtrip
description: |
  M0 PR3 — verify the post-completion judge writes durable knowledge from
  task1's output, and that knowledge is injected into task2's prompt.

  Uses FakeJudge (seed.judge: fake) which regex-extracts `KEY_INSIGHT: <text>`
  markers, sidestepping a real LLM. The agent stub script returns a marker
  in task1's output; on the second message we verify the agent receives a
  prompt containing the extracted insight by branching its response on
  `content_contains` of that insight string.

seed:
  judge: fake
  agents:
    claude:
      responses:
        # Task 1: emits a KEY_INSIGHT marker that FakeJudge will pick up.
        - when:
            content_contains: "summarize the foo report"
          text: |
            Summary of foo report.
            KEY_INSIGHT: tech sector recovering through Q3
            TASK_STATE: DONE
        # Task 2 path A: prompt contains injected memory from task 1.
        - when:
            content_contains: "tech sector recovering through Q3"
          text: |
            MATCH FOUND: insight is present in prompt
            TASK_STATE: DONE
        # Task 2 path B: fallback — prompt is missing the insight.
        - when:
            default: true
          text: |
            NO MATCH: insight is absent
            TASK_STATE: DONE

steps:
  # Task 1 — produce the insight
  - inject_user_message:
      thread_id: null
      author_id: "owner-1"
      # Explicit-only routing: `/task_start` is a Discord slash command not
      # wired in the harness channel; use the `task:` prefix (the in-message
      # explicit trigger) to create the artifact task.
      content: "task: summarize the foo report"
      capture:
        thread_id_as: "@thread1"
  - await:
      condition: task_status_eq
      task_thread: "@thread1"
      status: COMPLETED
      timeout_seconds: 30
  # Wait for the background post-completion judge to land its event.
  # Select tasks by thread, NOT positional task_index: task1 and task2 are
  # created in the same wall-clock second, so they tie on created_at and
  # SQLite's tie-break is non-deterministic. Positional indexing once
  # flaked here (task_index=1 intermittently resolved to the already-
  # COMPLETED task1, so the await passed before task2 ever ran). Gating on
  # this event also guarantees the insight is persisted before task2 runs.
  - await:
      condition: runtime_event
      task_thread: "@thread1"
      event_type: task.judge_extracted
      min_count: 1
      timeout_seconds: 30
  # Task 2 — should see memory injection
  - inject_user_message:
      thread_id: null
      author_id: "owner-1"
      content: "task: follow up on the report"
      capture:
        thread_id_as: "@thread2"
  - await:
      condition: task_status_eq
      task_thread: "@thread2"
      status: COMPLETED
      timeout_seconds: 30

expect:
  events_in_order:
    - type: send
      payload_contains: "MATCH FOUND"
  events_not_present:
    - type: send
      payload_contains: "NO MATCH"
